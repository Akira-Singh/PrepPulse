<div class = "dashboard-container" style="background-color: #1e1e24; color: #ffffff; padding: 2rem; min-height: 100vh; font-family: sans-serif;">
    <header style ="border-bottom: 2px solid #2e2e38; padding-bottom: 1rem; margin-bottom: 2rem;">
        <h1 style="color: #4caf50; margin: 0;">📊 PrepPulse Career Analytics</h1> 
        <p style="color:#a0a0a0; margin: 0.5rem 0 0 0;">Module 1: Intelligent ATS Resume Optimizer</p>
    </header>

    <div class ="workspace-grid" style="display: flex; gap: 2rem; margin-bottom: 2rem;">
        <!--Left Section: Inputs-->
        <div class="input-panel" style="flex: 1; display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; color: #4caf50;">1. Target Job Description</label>
                <textarea [(ngModel)]="jobDescription" placeholder="Paste the recruiter's job description text here..." style="width: 100%; height: 150px; background-color: #2b2b36; color: #ffffff; border: 1px solid #444; border-radius: 6px; padding: 0.75rem; box-sizing: border-box; resize: none;"></textarea>
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; color: #4caf50;">2. Your Current Resume Text Data</label>
                <textarea [(ngModel)]="resumeText" placeholder="Paste your raw resume skills text here..." style="width: 100%; height: 150px; background-color: #2b2b36; color: #ffffff; border: 1px solid #444; border-radius: 6px; padding: 0.75rem; box-sizing: border-box; resize: none;"></textarea>
            </div>

            <button (click) = "submitToAi()" [disabled]="isLoading" style="background-color: #4caf50; color: #ffffff; border: none; padding: 0.75rem 1.5 rem; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#45a049'" onmouseout="this.style.backgroundColor='#4caf50' ">
                {{isLoading ? 'Processing optimization metrics...' : '🚀 Optimize Resume Keywords'}}
            </button>

            <p *ngIf="errorMessage" style="color:#ff5252; font-weight: bold; margin: 0;">⚠️ {{ errorMessage }}</p>
        </div>
        <!--Right Section: Output Panel-->
        <div class="output-panel" style="flex: 1; background-color: #2b2b36; border: 1px solid #444; border-radius: 6px; padding: 1.5rem; display: flex; flex-direction: column;">
            <h3 style="margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 0.5rem; color: #4caf50;">💡 Live ATS Optimization Insights</h3>

            <div *ngIf="!aiFeedback && !isLoading" style="color: #a0a0a0; text-align: center;margin: auto;">
                Enter your career parameters and click optimize to map out missing keywords.
            </div>

            <div *ngIf="isLoading" style="color: #4caf50; text-align: center; margin: auto; font-weight: bold;">
                Analyzing framework variations with Gemini 3.8 Flash...
            </div>

            <!--Preserves the backend string newline formatting gaps natively-->
            <div *ngIf="aiFeedback && !isLoading" style="white-space: pre-line; line-height: 1,6; color: #e0e0e0; font-size: 0.95rem;">
                {{ aiFeedback }}
            </div>
        </div>
    </div>
</div>
